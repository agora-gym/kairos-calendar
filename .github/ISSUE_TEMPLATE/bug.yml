name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations: { required: true }
